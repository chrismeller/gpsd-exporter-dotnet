name: Pull request title

# Pull requests are squash-merged, so the title (or, for a single-commit pull request, that
# commit's message) becomes the commit on main that Release Please reads. It must be a
# Conventional Commit: feat: and fix: make a release, and so do commits marked as breaking.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          validateSingleCommit: true
