name: Release

# R12 / AC12.2: publishes a release. Release Please creates the vX.Y.Z tag and the GitHub release
# when its release pull request is merged, then calls this workflow (release-please.yml) with the
# version and the tag. The version is built into the binaries (--version, gpsd_exporter_build_info)
# and the image label, and is checked before anything is published. Publishing happens only after
# both binaries and both image architectures have passed their tests:
#   - the image goes to GHCR as ghcr.io/chrismeller/gpsd-exporter-dotnet:X.Y.Z and :latest;
#   - the GitHub release gets both binaries, their checksums and the systemd unit and env file.
#
# T12.2: a dry run builds and checks everything and publishes nothing. It runs on a pull
# request that changes this workflow, or by hand (workflow_dispatch) with a test version; the
# release files are then uploaded as the release-files artifact instead.
on:
  workflow_call:
    inputs:
      version:
        description: The release version, X.Y.Z.
        type: string
        required: true
      tag:
        description: The release's tag, vX.Y.Z. It and its GitHub release must already exist.
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-please.yml
      - scripts/check-release-version.sh
  workflow_dispatch:
    inputs:
      version:
        description: Test version for the dry run (nothing is published).
        type: string
        default: 0.0.0-dryrun

# Least privilege: read-only by default. Only the two publish jobs get write access, each to
# the one thing it publishes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chrismeller/gpsd-exporter-dotnet

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Only the workflow_call from Release Please passes a tag, and only it publishes.
          if [ -n "$INPUT_TAG" ]; then
            # Only an exact X.Y.Z release whose tag is vX.Y.Z publishes.
            if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::'$INPUT_VERSION' is not X.Y.Z."
              exit 1
            fi
            if [ "$INPUT_TAG" != "v$INPUT_VERSION" ]; then
              echo "::error::Tag '$INPUT_TAG' does not match version $INPUT_VERSION."
              exit 1
            fi
            version="$INPUT_VERSION"
            tag="$INPUT_TAG"
            publish=true
          elif [ "$EVENT" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            tag=""
            publish=false
          else
            version="0.0.0-dryrun.$RUN_NUMBER"
            tag=""
            publish=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version."
            exit 1
          fi
          echo "Version $version (publish: $publish)."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    name: Image
    needs: [version, binaries]
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # T12.2: each binary carries the release's version, checked natively on its own architecture.
  check-version:
    name: Check the version ${{ matrix.rid }}
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpsd-exporter-${{ matrix.rid }}
          path: dist

      - name: Check the version
        run: |
          (cd dist && sha256sum --check --strict "gpsd-exporter-$RID.sha256")
          chmod +x "dist/gpsd-exporter-$RID"
          scripts/check-release-version.sh "dist/gpsd-exporter-$RID" "$VERSION"

  # T12.2: every release file is present. A dry run leaves them here as an artifact.
  files:
    name: Release files
    needs: [binaries, check-version]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gpsd-exporter-linux-*
          merge-multiple: true
          path: dist

      - name: Gather the release files
        run: |
          mkdir release
          cp dist/gpsd-exporter-linux-x64 dist/gpsd-exporter-linux-x64.sha256 \
             dist/gpsd-exporter-linux-arm64 dist/gpsd-exporter-linux-arm64.sha256 \
             packaging/systemd/gpsd-exporter.service packaging/systemd/gpsd-exporter.env release/
          ls -l release

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish-image:
    name: Publish the image
    needs: [version, image, files]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gpsd-exporter-linux-*
          merge-multiple: true
          path: dist

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # The same build the image workflow tested, pushed with the version and latest tags.
      - name: Build and push both architectures
        run: |
          scripts/image-context.sh dist context
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file packaging/docker/Dockerfile --build-arg VERSION="$VERSION" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --push context
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Log out
        if: ${{ always() }}
        run: docker logout ghcr.io

  publish-release:
    name: Attach the files to the GitHub release
    needs: [version, files, publish-image]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      # Release Please has already created the release, with its changelog as the notes.
      - name: Attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json tagName,url
          gh release upload "$TAG" release/* --repo "$REPO" --clobber
