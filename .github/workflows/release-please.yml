name: Release Please

# Release Please keeps a release pull request open on main with the next version and its
# changelog, worked out from the Conventional Commit messages merged since the last release.
# Merging that pull request creates the vX.Y.Z tag and the GitHub release; this workflow then
# calls the release workflow, which builds, checks and publishes the binaries and the image and
# attaches the release files to that GitHub release.
#
# The release workflow is called directly rather than started by the tag: a tag created with
# GITHUB_TOKEN does not start other workflows.
#
# Optional secret RELEASE_PLEASE_TOKEN (a fine-grained token or GitHub App token with contents
# and pull-requests write): pull requests opened with GITHUB_TOKEN do not run CI, so without it the
# release pull request has no checks.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      tag: ${{ needs.release-please.outputs.tag_name }}
