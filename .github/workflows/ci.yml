name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # NuGet audit runs during restore and, with warnings as errors, fails on any
      # known-vulnerable package, direct or transitive (AC12.5).
      - name: Restore
        run: dotnet restore

      # Compiler, analyzer, trim and AOT warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore --configuration "$CONFIGURATION"

      - name: Test
        env:
          # The golden exposition test (T7.2) also writes its raw scrape here for promtool.
          GPSD_EXPORTER_GOLDEN_SCRAPE: ${{ runner.temp }}/golden-scrape.prom
        run: >-
          dotnet test --no-build --configuration "$CONFIGURATION"
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-trx

      # T7.4 / AC7.4: promtool finds no problems in a full scrape. The archive is pinned by
      # version and checksum (the Prometheus 3.5 long-term support release).
      # One lint finding is allowed: gpsd_device_bits_per_second is a serial line rate, which
      # is defined in bits, so promtool's "use bytes" naming rule does not apply. Any other
      # finding, or a parse error (exit 1), still fails the step.
      - name: Check the golden scrape with promtool
        env:
          PROMETHEUS_VERSION: "3.5.0"
          PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
          SCRAPE: ${{ runner.temp }}/golden-scrape.prom
        run: |
          test -s "$SCRAPE" || { echo "::error::The golden exposition test did not write $SCRAPE."; exit 1; }
          name="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$name.tar.gz"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/promtool"
          allowed='gpsd_device_bits_per_second use base unit "bytes" instead of "bits"'
          status=0
          output=$("$RUNNER_TEMP/$name/promtool" check metrics < "$SCRAPE" 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::promtool failed with exit code $status."
            exit 1
          fi
          remaining=$(printf '%s\n' "$output" | grep -vxF "$allowed" | grep -v '^[[:space:]]*$' || true)
          if [ -n "$remaining" ]; then
            echo "::error::promtool reported problems beyond the allowed bits_per_second finding."
            exit 1
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      # A second, explicit vulnerability check (T12.3). Restore already fails on these,
      # but this lists every vulnerable package in the log.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Known-vulnerable NuGet packages are referenced."
            exit 1
          fi

  # R11: Native AOT binaries for linux-x64 and linux-arm64, built and smoke-tested.
  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yml

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # T12.1 / AC12.1: nothing may refer to the original Go project, except the
      # README's acknowledgement of it.
      # The name is split so that this check does not match its own workflow file.
      - name: No references to the original repository
        run: |
          name="nate""sales"
          if git grep -n -i "$name" -- . ':(exclude)README.md'; then
            echo "::error::Found references to $name outside README.md."
            exit 1
          fi

      # AC12.3: every third-party action is pinned to a full commit SHA.
      - name: Actions are pinned to commit SHAs
        run: |
          if grep -rnE '^\s*-?\s*uses:\s*[^.][^@]*@' .github/workflows \
              | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "::error::Every action must be pinned to a 40-character commit SHA."
            exit 1
          fi
