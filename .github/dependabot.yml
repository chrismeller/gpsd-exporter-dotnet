version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-stack:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "NSubstitute*"
          - "Verify*"
          - "FsCheck*"
          - "Testcontainers*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # AC12.4: the container image's base (pinned by digest in packaging/docker/Dockerfile).
  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: weekly
